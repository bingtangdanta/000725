<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="微信">
<meta name="theme-color" content="#EDEDED">
<title>微信</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:#EDEDED;color:#1A1A1A;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
}
.nav{
  flex:0 0 auto;background:#EDEDED;display:flex;align-items:center;justify-content:center;
  position:relative;border-bottom:.5px solid #DCDCDC;
  height:calc(44px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
}
.nav .title{font-size:17px;font-weight:500}
.nav .more{
  position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 50%);transform:translateY(-50%);
  font-size:22px;line-height:1;color:#333;padding:4px 8px;cursor:pointer;
}
.chat{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 4px}
.time{text-align:center;font-size:12px;color:#B2B2B2;margin:14px 0 10px}
.row{display:flex;margin-bottom:14px;align-items:flex-start}
.row.her{justify-content:flex-start}
.row.me{justify-content:flex-end;flex-direction:row-reverse}
.avatar{
  flex:0 0 40px;width:40px;height:40px;border-radius:4px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:500;
}
.row.her .avatar{background:#C9D6C4}
.row.me .avatar{background:#B9C7D6}
.bubble{
  max-width:70%;padding:9px 12px;border-radius:4px;font-size:15px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;position:relative;text-align:left;
}
.row.her .bubble{background:#fff;margin-left:10px}
.row.me .bubble{background:#95EC69;margin-right:10px}
/* 旁白／动作：融进气泡里，不单独占一行 */
.aside{font-style:normal;opacity:.58;font-size:.94em;letter-spacing:.2px}
.aside.act{opacity:.78}
.row.her .bubble::before,.row.me .bubble::before{
  content:"";position:absolute;top:12px;border:5px solid transparent;
}
.row.her .bubble::before{left:-9px;border-right-color:#fff}
.row.me .bubble::before{right:-9px;border-left-color:#95EC69}
.typing{font-size:13px;color:#9A9A9A;padding:0 0 12px 62px}
.empty{text-align:center;color:#B2B2B2;font-size:13px;padding:60px 30px;line-height:1.9;white-space:pre-wrap}
.bar{
  flex:0 0 auto;background:#F7F7F7;border-top:.5px solid #DCDCDC;
  display:flex;align-items:flex-end;gap:8px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}
.icon{
  flex:0 0 auto;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  font-size:19px;color:#555;cursor:pointer;margin-bottom:3px;user-select:none;
}
#ta{
  flex:1 1 auto;min-height:36px;max-height:110px;border:none;outline:none;resize:none;
  border-radius:4px;background:#fff;padding:8px 10px;font-size:15px;line-height:20px;font-family:inherit;
}
#send{
  flex:0 0 auto;height:36px;padding:0 14px;border:none;border-radius:4px;
  background:#07C160;color:#fff;font-size:15px;font-family:inherit;
}
#send:active{background:#06AD56}
#send:disabled{background:#B9E6C9}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:50}
.sheet.on{display:flex}
.sheet .panel{width:100%;background:#fff;border-radius:12px 12px 0 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.sheet button{
  display:block;width:100%;background:none;border:none;padding:15px 20px;
  font-size:16px;font-family:inherit;color:#1A1A1A;text-align:center;
}
.sheet button:active{background:#F2F2F2}
.sheet button.cancel{color:#888;border-top:.5px solid #E5E5E5;margin-top:6px}
.sheet button.danger{color:#E64340}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
.modal.on{display:flex}
.card{width:100%;max-width:420px;max-height:84dvh;overflow:auto;background:#fff;border-radius:12px;padding:18px}
.card h3{font-size:16px;margin-bottom:14px;font-weight:600}
.card label{display:block;font-size:13px;color:#888;margin:12px 0 5px}
.card input,.card textarea,.card select{
  width:100%;border:1px solid #E0E0E0;border-radius:6px;padding:9px 10px;
  font-size:14px;font-family:inherit;outline:none;background:#FAFAFA;
}
.card textarea{min-height:120px;line-height:1.55;resize:vertical}
.card .tip{font-size:12px;color:#AAA;margin-top:6px;line-height:1.6}
.card .acts{display:flex;gap:10px;margin-top:18px}
.card .acts button{flex:1;height:42px;border:none;border-radius:8px;font-size:15px;font-family:inherit}
.card .acts .primary{background:#07C160;color:#fff}
.card .acts .ghost{background:#F2F2F2;color:#333}

/* ---------- 界面内提示，替掉 alert ---------- */
.toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(20,20,20,.82);color:#fff;font-size:14px;line-height:1.65;
  padding:14px 18px;border-radius:10px;max-width:78%;text-align:center;
  z-index:80;opacity:0;transition:opacity .18s;pointer-events:none;white-space:pre-wrap;
}
.toast.on{opacity:1}

/* ---------- 对方正在输入（标题栏小字） ---------- */
.nav .sub{
  position:absolute;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top) + 32px);
  font-size:11px;color:#9A9A9A;white-space:nowrap;display:none;
}
.nav .sub.on{display:block}

/* ---------- 回到底部 ---------- */
.tobottom{
  position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.96);
  box-shadow:0 1px 8px rgba(0,0,0,.16);display:none;align-items:center;justify-content:center;
  color:#555;font-size:17px;cursor:pointer;z-index:20;
}
.tobottom.on{display:flex}
.bubble{-webkit-user-select:none;user-select:none}
.bubble:active{filter:brightness(.96)}

/* ---------- 夜间 ---------- */
body.dark{background:#111;color:#D8D8D8}
body.dark .nav{background:#1B1B1B;border-bottom-color:#2A2A2A}
body.dark .nav .title{color:#D8D8D8}
body.dark .chat{background:#111}
body.dark .time{color:#777}
body.dark .row.her .bubble{background:#2C2C2C;color:#E4E4E4}
body.dark .row.me .bubble{background:#3D6E4B;color:#F2F2F2}
body.dark .row.her .bubble::before{border-right-color:#2C2C2C}
body.dark .row.me .bubble::before{border-left-color:#3D6E4B}
body.dark .bar{background:#1B1B1B;border-top-color:#2A2A2A}
body.dark #ta{background:#2A2A2A;color:#EDEDED}
body.dark .sheet .panel{background:#2A2A2A}
body.dark .sheet button{color:#E0E0E0}
body.dark .sheet button:active{background:#343434}
body.dark .sheet button.cancel{border-top-color:#3A3A3A;color:#999}
body.dark .card{background:#2A2A2A;color:#E0E0E0}
body.dark .card input,body.dark .card textarea,body.dark .card select{
  background:#1F1F1F;border-color:#3A3A3A;color:#EDEDED;
}
body.dark .card .acts .ghost{background:#333;color:#DDD}
body.dark .tobottom{background:rgba(58,58,58,.96);color:#DDD}
body.dark .empty{color:#777}
body.dark .typing{color:#777}

/* ---------- 引用栏 ---------- */
.quotebar{
  display:none;flex:0 0 auto;background:#F0F0F0;border-top:.5px solid #DCDCDC;
  padding:7px 12px;font-size:12px;color:#888;line-height:1.5;
}
.quotebar.on{display:flex;align-items:flex-start;gap:8px}
.quotebar .qt{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.quotebar .qx{flex:0 0 auto;color:#AAA;font-size:16px;padding:0 4px;cursor:pointer}
body.dark .quotebar{background:#232323;border-top-color:#2A2A2A;color:#8E8E8E}

/* ---------- 记忆本 ---------- */
.memlist{max-height:46dvh;overflow:auto;margin:6px 0 2px}
.memrow{
  display:flex;align-items:flex-start;gap:8px;padding:9px 2px;
  border-bottom:.5px solid #EEE;font-size:14px;line-height:1.6;
}
.memrow span{flex:1 1 auto;word-break:break-word}
.memrow i{flex:0 0 auto;color:#C9C9C9;font-size:15px;font-style:normal;cursor:pointer;padding:0 2px}
body.dark .memrow{border-bottom-color:#333}
body.dark .memrow i{color:#666}
.memempty{color:#B2B2B2;font-size:13px;text-align:center;padding:22px 0}
</style>
</head>
<body>

<div class="nav">
  <div class="title" id="title">林知夏</div>
  <div class="sub" id="sub">对方正在输入…</div>
  <div class="more" id="more">···</div>
</div>

<div class="chat" id="chat"></div>
<div class="tobottom" id="tobottom">⌄</div>

<div class="quotebar" id="quotebar">
  <div class="qt" id="qt"></div>
  <div class="qx" id="qx">✕</div>
</div>

<div class="bar">
  <div class="icon" id="setbtn">⚙</div>
  <textarea id="ta" rows="1" placeholder=""></textarea>
  <button id="send">发送</button>
</div>

<!-- 菜单 -->
<div class="sheet" id="sheet">
  <div class="panel">
    <button data-act="switch">切换角色</button>
    <button data-act="memory">记忆本</button>
    <button data-act="paste">粘贴她的回复</button>
    <button data-act="dark">夜间模式</button>
    <button data-act="clear" class="danger">清空这段对话</button>
    <button data-act="cancel" class="cancel">取消</button>
  </div>
</div>

<!-- 长按消息 -->
<div class="sheet" id="msgSheet">
  <div class="panel">
    <button data-mact="quote">引用这条</button>
    <button data-mact="copy">复制</button>
    <button data-mact="del" class="danger">删除这条</button>
    <button data-mact="cancel" class="cancel">取消</button>
  </div>
</div>

<!-- 记忆本 -->
<div class="modal" id="memModal">
  <div class="card">
    <h3>记忆本 · <span id="memWho">林知夏</span></h3>
    <div class="tip">写进去的事，她每轮都会读到，永远记得。一行一条，别写流水账。</div>
    <div class="memlist" id="memList"></div>
    <label>加一条</label>
    <input id="memInput" placeholder="例：下周三答辩 / 我怕黑 / 我姐在杭州">
    <div class="acts">
      <button class="ghost" id="memClose">关闭</button>
      <button class="primary" id="memAdd">加进去</button>
    </div>
  </div>
</div>

<!-- 粘贴回复 -->
<div class="modal" id="pasteModal">
  <div class="card">
    <h3>粘贴她的回复</h3>
    <textarea id="pasteText" style="min-height:150px"></textarea>
    <div class="acts">
      <button class="ghost" id="pasteCancel">取消</button>
      <button class="primary" id="pasteOk">放进对话</button>
    </div>
  </div>
</div>

<!-- 确认 -->
<div class="modal" id="okModal">
  <div class="card">
    <h3 id="okTitle">确认</h3>
    <div class="acts">
      <button class="ghost" id="okCancel">取消</button>
      <button class="primary" id="okYes">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 设置 -->
<div class="modal" id="modal">
  <div class="card">
    <h3>设置</h3>

    <label>API 地址</label>
    <input id="cfgBase" placeholder="https://api.deepseek.com">
    <div class="tip">DeepSeek 默认这个。别的兼容 OpenAI 的服务也能填。</div>

    <label>API Key</label>
    <input id="cfgKey" type="password" placeholder="sk-...">
    <div class="tip">只存在这台设备的浏览器里，不会上传、不会发给别人。</div>

    <label>模型</label>
    <input id="cfgModel" placeholder="deepseek-chat">

    <label>角色</label>
    <select id="cfgWho">
      <option value="lin">林知夏</option>
      <option value="gu">顾雪琪</option>
    </select>

    <label>她的人设（系统提示词）</label>
    <textarea id="cfgPrompt"></textarea>
    <div class="tip">把启动包整段贴进来，越长越像。留空则用内置的精简版。</div>

    <div class="acts">
      <button class="ghost" id="cancelCfg">取消</button>
      <button class="primary" id="saveCfg">保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= 默认人设（内置的精简版，可在设置里替换） ================= */
  var DEFAULT_PROMPT = {

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function stamp(ts){
    var d = new Date(ts), now = new Date();
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (d.toDateString() === now.toDateString()) return hm;
    var y = new Date(now); y.setDate(y.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return "昨天 " + hm;
    if (d.getFullYear() === now.getFullYear())
      return (d.getMonth()+1) + "月" + d.getDate() + "日 " + hm;
    return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日 " + hm;
  }

  function rich(t){

    var last = 0;
    for (var i = 0; i < msgs.length; i++){
      var m = msgs[i];
      if (i === 0 || (m.ts - last) > GAP){
        var t = document.createElement("div");
        t.className = "time";
        t.textContent = stamp(m.ts);
        chatEl.appendChild(t);

      last = m.ts;

      chatEl.appendChild(row);

      if (dup) continue;
      picked.push(hits[n]);
      used.push(hits[n].i);
    }
    picked.sort(function(a, b){ return a.i - b.i; });
    return picked;
  }

  /* ================= 调模型 ================= */
  function buildMessages(lastText){
    var msgs = store[who];
    var cut = Math.min(cutGet(who), msgs.length);
    var sp = systemPrompt(who);

    var rec = retrieve(who, lastText || "", 4);
    if (rec.length){
      sp += "\n\n【他以前跟你提过的事（这些你自己记得，原话在下面）】\n"
        + rec.map(function(r){
            return "· " + (r.role === "me" ? "他当时说：" : "你当时说：")
              + String(r.text).replace(/\n/g, " ").slice(0, 120);
          }).join("\n")
        + "\n如果这次聊到相关的事，直接接着聊就行。不要说「你说过」「上次」「你记得吗」，像本来就记得一样。";
    }

    var out = [{ role: "system", content: sp }];
    var start = Math.max(cut, msgs.length - WIN);
    for (var i = start; i < msgs.length; i++){
      out.push({
        role: msgs[i].role === "me" ? "user" : "assistant",
        content: msgs[i].text
      });
    }
    return out;
  }

  // 把最旧的一段压成几句事实，存进摘要，往后不再发送原文
  function summarizeIfNeeded(){
    var msgs = store[who];
    var cut = cutGet(who);
    if (msgs.length - cut <= SUM_TRIGGER) return Promise.resolve();

    var seg = msgs.slice(cut, cut + SUM_BATCH);
    if (!seg.length) return Promise.resolve();

    var lines = seg.map(function(m){
      return (m.role === "me" ? "他：" : "她：") + m.text.replace(/\n/g, " ");
    }).join("\n");

    return fetch(cfg.base.replace(/\/+$/, "") + "/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: "system", content:
            "把下面这段聊天里「关于他这个人的事实」压缩成不超过 3 句中文。"
            + "只写事实（他是什么人、说过什么打算、喜欢讨厌什么、发生过什么约定），"
            + "不要写情绪、不要写寒暄、不要编。没东西可写就只回一个空行。" },
          { role: "user", content: lines }
        ],
        temperature: 0.2,
        max_tokens: 200,
        stream: false
      })
    })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var t = j && j.choices && j.choices[0] && j.choices[0].message
        ? String(j.choices[0].message.content || "").trim() : "";
      if (t){
        var arr = sumGet(who);
        t.split(/\n+/).forEach(function(l){
          l = l.replace(/^[-·\d.\s]+/, "").trim();
          if (l.length > 3 && arr.length < 40) arr.push(l);
        });
        sumSet(who, arr);
      }
      cutSet(who, cut + SUM_BATCH);
    })
    .catch(function(){ /* 压不动就算了，别挡着聊天 */ });
  }

  function typing(on){
    var el = document.getElementById("_typing");
    var sub = document.getElementById("sub");
    if (on && !el){
      var d = document.createElement("div");
      d.id = "_typing";
      d.className = "typing";
      d.textContent = CHARS[who].name + "正在输入…";
      chatEl.appendChild(d);
      chatEl.scrollTop = chatEl.scrollHeight;
    } else if (!on && el){
      el.remove();
    }
    if (sub) sub.classList.toggle("on", !!on);
  }

  /* ================= 界面内提示（替掉 alert） ================= */
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("on"); }, 2600);
  }

  /* ================= 确认框（替掉 confirm） ================= */
  var okModal = document.getElementById("okModal");
  var okCb = null;
  function askOk(title, cb){
    document.getElementById("okTitle").textContent = title;
    okCb = cb;
    okModal.classList.add("on");
  }
  document.getElementById("okCancel").addEventListener("click", function(){
    okModal.classList.remove("on"); okCb = null;
  });
  document.getElementById("okYes").addEventListener("click", function(){
    okModal.classList.remove("on");
    var f = okCb; okCb = null; if (f) f();
  });

  /* ================= 粘贴框（替掉 prompt） ================= */
  var pasteModal = document.getElementById("pasteModal");
  var pasteText = document.getElementById("pasteText");
  function openPaste(title){
    document.querySelector("#pasteModal h3").textContent = title || "粘贴她的回复";
    pasteText.value = "";
    pasteModal.classList.add("on");
    setTimeout(function(){ pasteText.focus(); }, 60);
  }
  document.getElementById("pasteCancel").addEventListener("click", function(){
    pasteModal.classList.remove("on");
  });
  document.getElementById("pasteOk").addEventListener("click", function(){
    var s = pasteText.value.replace(/\s+$/, "");
    pasteModal.classList.remove("on");
    if (s.trim()) push("her", s);
  });

  function ask(){
    if (!cfg.key){
      toast("还没填 API Key\n右上角 ⚙ → 填进去 → 保存");
      return;
    }
    var base = cfg.base.replace(/\/+$/, "");
    var url = base + "/chat/completions";

    typing(true);
    sendBtn.disabled = true;

    // 先看要不要把最旧的一段压成摘要，再发正式请求
    var lastText = "";
    var _ms = store[who];
    for (var _i = _ms.length - 1; _i >= 0; _i--){
      if (_ms[_i].role === "me"){ lastText = _ms[_i].text; break; }
    }

    summarizeIfNeeded().then(function(){
      return fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + cfg.key
        },
        body: JSON.stringify({
          model: cfg.model,
          messages: buildMessages(lastText),
          temperature: 0.95,
          max_tokens: 300,
          stream: false
        })
      });
    })
    .then(function(r){
      if (!r.ok) return r.text().then(function(t){ throw new Error(r.status + " " + t.slice(0,200)); });
      return r.json();
    })
    .then(function(j){
      typing(false);
      sendBtn.disabled = false;
      var txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
      txt = txt.trim();
      if (txt) push("her", txt);
      else toast("她没回出来\n再发一句试试");
    })
    .catch(function(err){
      typing(false);
      sendBtn.disabled = false;
      var msg = String(err && err.message || err);
      if (/Failed to fetch|NetworkError|CORS/i.test(msg)){
        toast("连不上模型\n\n如果是手机直接打开文件，浏览器会拦跨域。\n用电脑双击 启动.bat 再打开。");
      } else {
        toast("出错了\n" + msg);
      }
    });
  }

  /* ================= 引用 ================= */
  var quote = null;
  var quotebar = document.getElementById("quotebar");
  var qtEl = document.getElementById("qt");

  function setQuote(text){
    quote = text;
    qtEl.textContent = "引用：" + text.replace(/\n/g, " ").slice(0, 60);
    quotebar.classList.add("on");
    ta.focus();
  }
  function clearQuote(){
    quote = null;
    quotebar.classList.remove("on");
  }
  document.getElementById("qx").addEventListener("click", clearQuote);

  /* ================= 发送 ================= */
  function sendMine(){
    var v = ta.value.replace(/\s+$/, "");
    if (!v && !quote) return;
    var body = v;
    if (quote){
      body = "（他引用了你之前说的一句：" + quote.replace(/\n/g, " ") + "）\n" + v;
      clearQuote();
    }
    push("me", body);
    ta.value = "";
    ta.style.height = "auto";
    ask();
  }

  sendBtn.addEventListener("click", sendMine);

  ta.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      sendMine();
    }
  });

  ta.addEventListener("input", function(){
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 110) + "px";
  });

  /* ================= 菜单 ================= */
  var sheet = document.getElementById("sheet");
  document.getElementById("more").addEventListener("click", function(){ sheet.classList.add("on"); });

  sheet.addEventListener("click", function(e){
    var act = e.target.getAttribute("data-act");
    if (!act) return;
    sheet.classList.remove("on");

    if (act === "cancel") return;

    if (act === "switch"){
      who = who === "lin" ? "gu" : "lin";
      localStorage.setItem("wx_who", who);
      if (!store[who]) store[who] = load(who);
      document.getElementById("title").textContent = CHARS[who].name;
      render();
      return;
    }

    if (act === "memory"){
      openMem();
      return;
    }

    if (act === "paste"){
      openPaste("粘贴" + CHARS[who].name + "的回复");
      return;
    }

    if (act === "dark"){
      var on = document.body.classList.toggle("dark");
      localStorage.setItem("wx_dark", on ? "1" : "0");
      document.querySelector('[data-act="dark"]').textContent = on ? "白天模式" : "夜间模式";
      return;
    }

    if (act === "clear"){
      askOk("清空和" + CHARS[who].name + "的全部对话？\n不能恢复。", function(){
        store[who] = [];
        save(who, []);
        render();
      });
    }
  });

  /* ================= 长按消息 ================= */
  var msgSheet = document.getElementById("msgSheet");
  var lpIndex = -1, lpTimer = null, lpMoved = false;

  function openMsgMenu(i){
    lpIndex = i;
    msgSheet.classList.add("on");
  }

  msgSheet.addEventListener("click", function(e){
    var act = e.target.getAttribute("data-mact");
    if (!act) return;
    msgSheet.classList.remove("on");
    if (act === "cancel" || lpIndex < 0) return;

    var m = store[who][lpIndex];
    if (!m) return;

    if (act === "quote"){
      setQuote(m.text);
      return;
    }

    if (act === "copy"){
      var t = m.text;
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(function(){ toast("已复制"); }, function(){ toast("复制没成功"); });
      } else {
        var tmp = document.createElement("textarea");
        tmp.value = t; document.body.appendChild(tmp); tmp.select();
        try{ document.execCommand("copy"); toast("已复制"); }catch(e){ toast("复制没成功"); }
        tmp.remove();
      }
      return;
    }

    if (act === "del"){
      store[who].splice(lpIndex, 1);
      save(who, store[who]);
      render();
      toast("已删除");
    }
  });

  function bindLongPress(el, index){
    function start(ev){
      lpMoved = false;
      clearTimeout(lpTimer);
      lpTimer = setTimeout(function(){
        if (!lpMoved) openMsgMenu(index);
      }, 480);
    }
    function move(){ lpMoved = true; }
    function end(){ clearTimeout(lpTimer); }

    el.addEventListener("touchstart", start, { passive: true });
    el.addEventListener("touchmove", move, { passive: true });
    el.addEventListener("touchend", end);
    el.addEventListener("mousedown", start);
    el.addEventListener("mousemove", move);
    el.addEventListener("mouseup", end);
    el.addEventListener("mouseleave", end);
    el.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  }

  /* ================= 设置 ================= */
  var modal = document.getElementById("modal");
  document.getElementById("setbtn").addEventListener("click", function(){
    document.getElementById("cfgBase").value = cfg.base;
    document.getElementById("cfgKey").value = cfg.key;
    document.getElementById("cfgModel").value = cfg.model;
    document.getElementById("cfgWho").value = who;
    document.getElementById("cfgPrompt").value = promptOf(who);
    modal.classList.add("on");
  });

  document.getElementById("cancelCfg").addEventListener("click", function(){
    modal.classList.remove("on");
  });

  document.getElementById("cfgWho").addEventListener("change", function(){
    document.getElementById("cfgPrompt").value = promptOf(this.value);
  });

  document.getElementById("saveCfg").addEventListener("click", function(){
    cfg.base = document.getElementById("cfgBase").value.trim() || "https://api.deepseek.com";
    cfg.key = document.getElementById("cfgKey").value.trim();
    cfg.model = document.getElementById("cfgModel").value.trim() || "deepseek-chat";
    cfgSet(cfg);

    var w = document.getElementById("cfgWho").value;
    var p = document.getElementById("cfgPrompt").value.trim();
    if (p) localStorage.setItem("wx_prompt_" + w, p);

    if (w !== who){
      who = w;
      localStorage.setItem("wx_who", who);
      if (!store[who]) store[who] = load(who);
      document.getElementById("title").textContent = CHARS[who].name;
      render();
    }

    modal.classList.remove("on");
  });

  /* ================= 记忆本面板 ================= */
  var memModal = document.getElementById("memModal");
  var memListEl = document.getElementById("memList");
  var memInput = document.getElementById("memInput");

  function renderMem(){
    var arr = memGet(who);
    memListEl.innerHTML = "";
    if (!arr.length){
      var e = document.createElement("div");
      e.className = "memempty";
      e.textContent = "还空着。\n写一条，她就永远记得。";
      e.style.whiteSpace = "pre-wrap";
      memListEl.appendChild(e);
      return;
    }
    arr.forEach(function(txt, i){
      var row = document.createElement("div");
      row.className = "memrow";
      var s = document.createElement("span");
      s.textContent = txt;
      var x = document.createElement("i");
      x.textContent = "✕";
      x.addEventListener("click", function(){
        var a = memGet(who);
        a.splice(i, 1);
        memSet(who, a);
        renderMem();
      });
      row.appendChild(s);
      row.appendChild(x);
      memListEl.appendChild(row);
    });
  }

  function openMem(){
    document.getElementById("memWho").textContent = CHARS[who].name;
    memInput.value = "";
    renderMem();
    memModal.classList.add("on");
  }

  document.getElementById("memClose").addEventListener("click", function(){
    memModal.classList.remove("on");
  });

  document.getElementById("memAdd").addEventListener("click", function(){
    var v = memInput.value.replace(/\s+/g, " ").trim();
    if (!v) return;
    if (v.length > 80) v = v.slice(0, 80);
    var arr = memGet(who);
    arr.push(v);
    memSet(who, arr);
    memInput.value = "";
    renderMem();
    toast("记住了");
  });

  /* ================= 她的样子 ================= */
  function showAppear(){
    var wrap = document.createElement("div");
    wrap.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:18px";
    var card = document.createElement("div");
    card.style.cssText = "background:#fff;border-radius:12px;max-width:420px;width:100%;max-height:78vh;overflow:auto;padding:16px;font-size:14px;line-height:1.8;color:#222";
    var h = document.createElement("div");
    h.style.cssText = "font-weight:600;margin-bottom:8px";
    h.textContent = CHARS[who].name + " 的样子";
    var p = document.createElement("div");
    p.textContent = APPEAR[who] || "";
    var btn = document.createElement("div");
    btn.textContent = "知道了";
    btn.style.cssText = "margin-top:14px;text-align:center;color:#576B95;padding:8px";
    btn.addEventListener("click", function(){ wrap.remove(); });
    wrap.addEventListener("click", function(e){ if (e.target === wrap) wrap.remove(); });
    card.appendChild(h);
    card.appendChild(p);
    card.appendChild(btn);
    wrap.appendChild(card);
    document.body.appendChild(wrap);
  }

  (function(){
    var it = document.createElement("div");
    it.className = "item";
    it.textContent = "她的样子";
    it.addEventListener("click", function(){
      sheet.classList.remove("on");
      showAppear();
    });
    sheet.appendChild(it);
  })();


  /* ================= 导出 / 导入 ================= */
  function doExport(){
    var data = { app:"linzhixia-wx", at:new Date().toISOString(), chats:{}, mem:{}, sum:{} };
    ["lin","gu"].forEach(function(w){
      try { data.chats[w] = JSON.parse(localStorage.getItem("wx_chat_"+w) || "[]"); } catch(e){ data.chats[w]=[]; }
      data.mem[w] = memGet(w);
      try { data.sum[w] = JSON.parse(localStorage.getItem("wx_sum_"+w) || "[]"); } catch(e){ data.sum[w] = []; }
    });
    var blob = new Blob([JSON.stringify(data, null, 1)], {type:"application/json"});
    var a = document.createElement("a");
    var d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = "聊天备份_" + d.getFullYear() + ("0"+(d.getMonth()+1)).slice(-2) + ("0"+d.getDate()).slice(-2) + "_" + ("0"+d.getHours()).slice(-2) + ("0"+d.getMinutes()).slice(-2) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
    toast("备份已导出");
  }

  function doImport(){
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = ".json,application/json";
    inp.addEventListener("change", function(){
      var f = inp.files && inp.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function(){
        var d;
        try { d = JSON.parse(fr.result); } catch(e){ askOk("这个文件读不出来，可能不是备份文件。", function(){}); return; }
        if (!d || d.app !== "linzhixia-wx"){ askOk("这不是本应用导出的备份文件。", function(){}); return; }
        var n = 0;
        ["lin","gu"].forEach(function(w){
          if (d.chats && d.chats[w] && d.chats[w].length){
            localStorage.setItem("wx_chat_"+w, JSON.stringify(d.chats[w]));
            n += d.chats[w].length;
          }
          if (d.mem && d.mem[w] && d.mem[w].length){
            localStorage.setItem("wx_mem_"+w, JSON.stringify(d.mem[w]));
          }
          if (d.sum && d.sum[w]){
            localStorage.setItem("wx_sum_"+w, JSON.stringify(d.sum[w]));
          }
        });
        askOk("导入完成，恢复 " + n + " 条聊天。", function(){ location.reload(); });
      };
      fr.readAsText(f);
    });
    inp.click();
  }

  (function(){
    var it1 = document.createElement("div");
    it1.className = "item";
    it1.textContent = "导出备份";
    it1.addEventListener("click", function(){
      sheet.classList.remove("on");
      doExport();
    });
    sheet.appendChild(it1);

    var it2 = document.createElement("div");
    it2.className = "item";
    it2.textContent = "导入备份";
    it2.addEventListener("click", function(){
      sheet.classList.remove("on");
      doImport();
    });
    sheet.appendChild(it2);
  })();

  /* ================= 启动 ================= */
  if (localStorage.getItem("wx_dark") === "1"){
    document.body.classList.add("dark");
    var dbtn = document.querySelector('[data-act="dark"]');
    if (dbtn) dbtn.textContent = "白天模式";
  }
  document.getElementById("title").textContent = CHARS[who].name;
  render();
  setTimeout(function(){ chatEl.scrollTop = chatEl.scrollHeight; updToBottom(); }, 30);

})();
</script>
</body>
